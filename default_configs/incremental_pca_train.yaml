# lightning.pytorch==2.5.2
seed_everything: true
trainer:
  strategy:
    class_path: lightning.pytorch.strategies.DDPStrategy
    dict_kwargs:
      broadcast_buffers: false
  max_epochs: 1
  logger: null
  default_root_dir: gs://cellarium-dev-central/workflows/20260402_human_64pca_8000hvg
model:
  transforms:
    - cellarium.ml.transforms.NormalizeTotal
    - cellarium.ml.transforms.Log1p
    - class_path: cellarium.ml.transforms.ZScore
      init_args:
        mean_g:
          !CheckpointLoader
          file_path: gs://cellarium-dev-central/workflows/20260402_human_onepass/lightning_logs/version_0/checkpoints/epoch=0-step=18894.ckpt
          attr: model.mean_g
        std_g:
          !CheckpointLoader
          file_path: gs://cellarium-dev-central/workflows/20260402_human_onepass/lightning_logs/version_0/checkpoints/epoch=0-step=18894.ckpt
          attr: model.std_g
        var_names_g:
          !CheckpointLoader
          file_path: gs://cellarium-dev-central/workflows/20260402_human_onepass/lightning_logs/version_0/checkpoints/epoch=0-step=18894.ckpt
          attr: model.var_names_g
    - class_path: cellarium.ml.transforms.Filter
      init_args:
        filter_list:
          !FileLoader
          file_path: gs://cellarium-dev-central/workflows/20260331_czi_human_primary_20251108_gte300genes_hvg_seurat_v3/hvg_seurat_v3_output__hvg_only.csv
          loader_fn: pandas.read_csv
          attr: "feature_id"
          convert_fn: pandas.Series.to_list
  model:
    class_path: cellarium.ml.models.IncrementalPCA
    init_args:
      n_components: 64
data:
  dadc:
    class_path: cellarium.ml.data.DistributedAnnDataCollection
    init_args:
      filenames: gs://cellarium-nexus-file-system-3293a8/pipeline/data-extracts/czi_human_primary_gr300genes/extract_files/extract_{000000..000050}.h5ad
      shard_size: 10_000
      last_shard_size: null
      max_cache_size: 2
      obs_columns_to_validate:
        - raw_sum
  batch_keys:
    x_ng:
      attr: X
      convert_fn: cellarium.ml.utilities.data.densify
    var_names_g:
      attr: var
      key: feature_id
    total_mrna_umis_n:
      attr: obs
      key: raw_sum
  batch_size: 5000
  num_workers: 8  # limited by memory on n1-standard-16
  prefetch_factor: 4
  persistent_workers: false
ckpt_path: null
