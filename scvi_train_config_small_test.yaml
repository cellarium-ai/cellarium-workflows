# lightning.pytorch==2.4.0
seed_everything: true
trainer:
  accelerator: auto
  strategy: auto
    # class_path: lightning.pytorch.strategies.DDPStrategy
    # dict_kwargs:
    #   broadcast_buffers: false
    #   find_unused_parameters: true
  devices: 1
  num_nodes: 1
  precision: 32
  logger:
  callbacks:
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: step
      log_momentum: false
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      every_n_epochs: 1
      # every_n_train_steps: 2000
      # save_top_k: 1
  # - class_path: lightning.pytorch.callbacks.DeviceStatsMonitor
  #   init_args:
  #     cpu_stats: true
  # - class_path: lightning.pytorch.callbacks.EarlyStopping
  #   init_args:
  #     monitor: train_loss
  #     min_delta: 0.0
  #     patience: 45
  #     mode: min
  fast_dev_run: false
  max_epochs: 5
  min_epochs:
  max_steps: -1
  min_steps:
  max_time:
  limit_train_batches:
  limit_val_batches:
  limit_test_batches:
  limit_predict_batches:
  overfit_batches: 0.0
  val_check_interval:
  check_val_every_n_epoch:
  num_sanity_val_steps:
  log_every_n_steps: 1
  enable_checkpointing: true
  enable_progress_bar: true
  enable_model_summary:
  accumulate_grad_batches: 1
  gradient_clip_val: 50
  gradient_clip_algorithm: norm
  deterministic:
  benchmark:
  inference_mode: false
  use_distributed_sampler: true
  profiler:
  detect_anomaly: false
  barebones: false
  plugins:
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: .  #/gcs/cellarium-human-primary-data/curriculum/human_all_primary_20241108/trained_models/20250801_scvi_small_test/
model:
  cpu_transforms:
  - class_path: cellarium.ml.transforms.Filter
    init_args:
      filter_list: !FileLoader
        file_path: 
          gs://cellarium-human-primary-data/curriculum/human_all_primary_20241108/configs/scvi_hvg.txt
        loader_fn: pandas.read_csv
        attr: "ensembl_id"
        convert_fn: pandas.Series.to_list

  model:
    class_path: cellarium.ml.models.SingleCellVariationalInference
    init_args:

      # these are pulled from data, leave null
      var_names_g:
      n_batch:

      # these can be changed
      batch_embedded: false
      batch_representation_sampled: false
      n_latent_batch:
      batch_kl_weight_max: 0.0
      kl_warmup_epochs: 5
      kl_annealing_start: 0.0
      z_kl_weight_max: 1.0
      encoder:
        hidden_layers:
        - class_path: cellarium.ml.models.scvi.LinearWithBatch
          init_args:
            out_features: 128
            batch_to_bias_hidden_layers: []  # one linear transformation: what scvi-tools does
        final_layer:
          class_path: torch.nn.Linear
          init_args: {}
      decoder:
        hidden_layers:
        - class_path: cellarium.ml.models.scvi.LinearWithBatch
          init_args:
            out_features: 128
            batch_to_bias_hidden_layers: []
              # hidden_layers:
              # - class_path: torch.nn.Linear
              #     init_args:
              #       out_features: 10
              # - class_path: torch.nn.Linear
              #     init_args:
              #       out_features: 20
        final_layer:
          class_path: torch.nn.Linear  # cellarium.ml.models.scvi.LinearWithBatch
          init_args: {}
            # batch_to_bias_hidden_layers: []
        final_additive_bias: false
      n_latent: 50

      # probably leave these alone
      n_continuous_cov: 0
      n_cats_per_cov:
      dropout_rate: 0.1
      dispersion: gene
      log_variational: true
      gene_likelihood: nb
      latent_distribution: normal
      use_batch_norm: both
      use_layer_norm: none
      use_size_factor_key: false
      use_observed_lib_size: true
  optim_fn: torch.optim.Adam
  optim_kwargs:
    lr: 1e-3
    weight_decay: 1e-6
    eps: 0.01
  scheduler_fn:
  scheduler_kwargs:
  is_initialized: false
data:
  dadc:
    class_path: cellarium.ml.data.DistributedAnnDataCollection
    init_args:
      filenames: extract_{0..10}.h5ad
      limits:
      shard_size: 10_000
      last_shard_size: 10_000
      max_cache_size: 2
      cache_size_strictly_enforced: true
      label:
      keys:
      index_unique:
      convert:
      indices_strict: true
      obs_columns_to_validate: []
        # - donor_dataset_concat
        # - suspension_type
        # - assay
  batch_keys:
    x_ng:
      attr: X
      convert_fn: cellarium.ml.utilities.data.densify
    var_names_g:
      attr: var_names
    batch_index_n:
      attr: obs
      key: donor_dataset_concat
      convert_fn: cellarium.ml.utilities.data.categories_to_codes
    categorical_covariate_index_nd:
      attr: obs
      key:
      - suspension_type
      - assay
      convert_fn: cellarium.ml.utilities.data.categories_to_codes
  batch_size: 512
  iteration_strategy: cache_efficient
  shuffle: true
  shuffle_seed: 0
  drop_last_indices: false
  drop_incomplete_batch: false
  worker_seed:
  test_mode: false
  num_workers: 0
  prefetch_factor:
  persistent_workers: false
ckpt_path:
